<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="heroCenterGlow" cx="65%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#008CFF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#07111F" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="serverRackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#07111F" />
  <rect width="1920" height="1080" fill="url(#heroCenterGlow)" />

  <!-- Datacenter Server Racks & Fiber Lines in Distance (Abstract / Cinematic) -->
  <g opacity="0.15">
    <!-- Server Rack 1 -->
    <rect x="1350" y="200" width="120" height="600" rx="6" fill="url(#serverRackGrad)" stroke="#008CFF" stroke-width="1" />
    <!-- Blinking Server LEDs -->
    <circle cx="1380" cy="240" r="3" fill="#38BDF8" />
    <circle cx="1400" cy="240" r="3" fill="#10B981" />
    <circle cx="1420" cy="240" r="3" fill="#38BDF8" />
    <circle cx="1380" cy="300" r="3" fill="#10B981" />
    <circle cx="1400" cy="300" r="3" fill="#38BDF8" />
    <circle cx="1380" cy="360" r="3" fill="#38BDF8" />
    <circle cx="1400" cy="360" r="3" fill="#10B981" />
    <circle cx="1380" cy="420" r="3" fill="#10B981" />
    
    <!-- Server Rack 2 -->
    <rect x="1520" y="160" width="130" height="680" rx="6" fill="url(#serverRackGrad)" stroke="#008CFF" stroke-width="1" />
    <circle cx="1550" cy="200" r="3" fill="#10B981" />
    <circle cx="1570" cy="200" r="3" fill="#38BDF8" />
    <circle cx="1550" cy="260" r="3" fill="#38BDF8" />
    <circle cx="1570" cy="260" r="3" fill="#10B981" />
    <circle cx="1550" cy="320" r="3" fill="#10B981" />
    
    <!-- Server Rack 3 -->
    <rect x="1700" y="120" width="140" height="760" rx="6" fill="url(#serverRackGrad)" stroke="#008CFF" stroke-width="1" />
    <circle cx="1730" cy="180" r="3" fill="#38BDF8" />
    <circle cx="1750" cy="180" r="3" fill="#10B981" />
  </g>

  <!-- Fiber Optic Grid Lines & Data Packets -->
  <g stroke="#008CFF" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M 0 350 C 400 350, 600 200, 1100 200 C 1400 200, 1600 380, 1920 380" />
    <path d="M 0 550 C 350 550, 750 420, 1200 420 C 1500 420, 1750 620, 1920 620" />
    <path d="M 0 750 C 500 750, 800 680, 1300 680 C 1600 680, 1800 850, 1920 850" />
  </g>

  <!-- Light Points / Node Intersections -->
  <circle cx="1100" cy="200" r="4" fill="#008CFF" fill-opacity="0.4" />
  <circle cx="1200" cy="420" r="4" fill="#38BDF8" fill-opacity="0.5" />
  <circle cx="1300" cy="680" r="4" fill="#008CFF" fill-opacity="0.4" />
</svg>
