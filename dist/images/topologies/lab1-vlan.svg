<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1C33" />
    </linearGradient>
    <linearGradient id="ciscoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
    <linearGradient id="vlan10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="vlan20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="8" />
  
  <!-- Subtle Grid -->
  <g stroke="rgba(0, 140, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Header Banner -->
  <rect x="20" y="20" width="760" height="40" rx="6" fill="#0A182E" stroke="#008CFF" stroke-width="1" stroke-opacity="0.3" />
  <text x="40" y="45" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#00A3FF">TOPOLOGY: VLAN &amp; INTER-VLAN ROUTING (ROUTER-ON-A-STICK)</text>
  <text x="730" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">IEEE 802.1Q Encapsulation</text>

  <!-- Connection Links -->
  <!-- Router to Switch (Trunk) -->
  <line x1="400" y1="120" x2="400" y2="220" stroke="#00A3FF" stroke-width="3" stroke-dasharray="6,4" />
  <rect x="340" y="155" width="120" height="24" rx="4" fill="#0B1E38" stroke="#008CFF" stroke-width="1" />
  <text x="400" y="171" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="middle">802.1Q Trunk (G0/0/0)</text>

  <!-- Switch to PC1 (VLAN 10) -->
  <line x1="370" y1="240" x2="220" y2="340" stroke="#38BDF8" stroke-width="2" />
  <text x="270" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Fa0/1 (Access 10)</text>

  <!-- Switch to PC2 (VLAN 20) -->
  <line x1="430" y1="240" x2="580" y2="340" stroke="#34D399" stroke-width="2" />
  <text x="490" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Fa0/2 (Access 20)</text>

  <!-- Router: R1-Gateway -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="32" fill="#091E3A" stroke="#00A3FF" stroke-width="2" filter="url(#glow)" />
    <!-- Router arrows cross icon -->
    <path d="M -16 -6 L -6 -6 L -6 -14 L 0 -14 L 0 -6 L 16 -6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 16 6 L 6 6 L 6 14 L 0 14 L 0 6 L -16 6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#38BDF8" />
    <text x="0" y="-40" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Router: R1-Gateway</text>
    <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8" text-anchor="middle">Subinterfaces: G0/0.10 &amp; G0/0.20</text>
  </g>

  <!-- Switch: SW1-Core2960 -->
  <g transform="translate(400, 230)">
    <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#0A2244" stroke="#008CFF" stroke-width="2" />
    <!-- Switch arrows -->
    <path d="M -30 -4 L -10 -4 M -10 -8 L -6 -4 L -10 0" stroke="#38BDF8" stroke-width="2" fill="none" />
    <path d="M 30 4 L 10 4 M 10 8 L 6 4 L 10 0" stroke="#38BDF8" stroke-width="2" fill="none" />
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Cisco Catalyst 2960</text>
  </g>

  <!-- VLAN 10 Zone -->
  <rect x="80" y="290" width="280" height="130" rx="8" fill="rgba(2, 132, 199, 0.08)" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="95" y="300" width="90" height="20" rx="3" fill="#0284C7" />
  <text x="140" y="314" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">VLAN 10: Sales</text>

  <!-- PC 1 -->
  <g transform="translate(220, 360)">
    <rect x="-24" y="-18" width="48" height="32" rx="3" fill="#0F2B52" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="-18" y="-14" width="36" height="22" fill="#061324" />
    <rect x="-8" y="14" width="16" height="6" fill="#38BDF8" />
    <rect x="-14" y="20" width="28" height="3" fill="#38BDF8" />
    <text x="0" y="-24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">PC-Sales-01</text>
    <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">192.168.10.10/24</text>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">GW: 192.168.10.1</text>
  </g>

  <!-- VLAN 20 Zone -->
  <rect x="440" y="290" width="280" height="130" rx="8" fill="rgba(5, 150, 105, 0.08)" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="455" y="300" width="110" height="20" rx="3" fill="#059669" />
  <text x="510" y="314" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">VLAN 20: Engineering</text>

  <!-- PC 2 -->
  <g transform="translate(580, 360)">
    <rect x="-24" y="-18" width="48" height="32" rx="3" fill="#0A3326" stroke="#34D399" stroke-width="1.5" />
    <rect x="-18" y="-14" width="36" height="22" fill="#03160F" />
    <rect x="-8" y="14" width="16" height="6" fill="#34D399" />
    <rect x="-14" y="20" width="28" height="3" fill="#34D399" />
    <text x="0" y="-24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">PC-Eng-01</text>
    <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle">192.168.20.10/24</text>
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">GW: 192.168.20.1</text>
  </g>
</svg>
