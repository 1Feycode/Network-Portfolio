<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1C33" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)" rx="8" />

  <!-- Grid -->
  <g stroke="rgba(0, 140, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Banner -->
  <rect x="20" y="20" width="760" height="40" rx="6" fill="#0A182E" stroke="#008CFF" stroke-width="1" stroke-opacity="0.3" />
  <text x="40" y="45" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#00A3FF">TOPOLOGY: SINGLE-AREA OSPFv2 (AREA 0 BACKBONE)</text>
  <text x="730" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">Process ID: 1 | Dead: 40s | Hello: 10s</text>

  <!-- Area 0 Cloud Boundary -->
  <ellipse cx="400" cy="245" rx="330" ry="155" fill="rgba(0, 140, 255, 0.04)" stroke="#008CFF" stroke-width="1.5" stroke-dasharray="6,6" />
  <rect x="350" y="95" width="100" height="22" rx="4" fill="#008CFF" />
  <text x="400" y="110" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">OSPF AREA 0</text>

  <!-- Triangle Serial Links -->
  <!-- R1 to R2 -->
  <line x1="220" y1="210" x2="580" y2="210" stroke="#F59E0B" stroke-width="2.5" />
  <rect x="350" y="198" width="100" height="24" rx="4" fill="#1C180A" stroke="#F59E0B" stroke-width="1" />
  <text x="400" y="214" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24" text-anchor="middle">10.0.12.0/30 (Cost 64)</text>

  <!-- R1 to R3 -->
  <line x1="220" y1="210" x2="400" y2="340" stroke="#00A3FF" stroke-width="2.5" />
  <text x="260" y="295" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">10.0.13.0/30 (Cost 10)</text>

  <!-- R2 to R3 -->
  <line x1="580" y1="210" x2="400" y2="340" stroke="#00A3FF" stroke-width="2.5" />
  <text x="490" y="295" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">10.0.23.0/30 (Cost 10)</text>

  <!-- Router 1 -->
  <g transform="translate(220, 210)">
    <circle cx="0" cy="0" r="34" fill="#091E3A" stroke="#00A3FF" stroke-width="2" filter="url(#glow2)" />
    <path d="M -16 -6 L -6 -6 L -6 -14 L 0 -14 L 0 -6 L 16 -6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 16 6 L 6 6 L 6 14 L 0 14 L 0 6 L -16 6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="0" y="-42" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Router: R1-HQ</text>
    <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">Router-ID: 1.1.1.1</text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Loopback0: 192.168.1.1/24</text>
  </g>

  <!-- Router 2 -->
  <g transform="translate(580, 210)">
    <circle cx="0" cy="0" r="34" fill="#091E3A" stroke="#00A3FF" stroke-width="2" filter="url(#glow2)" />
    <path d="M -16 -6 L -6 -6 L -6 -14 L 0 -14 L 0 -6 L 16 -6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 16 6 L 6 6 L 6 14 L 0 14 L 0 6 L -16 6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="0" y="-42" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Router: R2-Branch</text>
    <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">Router-ID: 2.2.2.2</text>
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Loopback0: 192.168.2.1/24</text>
  </g>

  <!-- Router 3 -->
  <g transform="translate(400, 340)">
    <circle cx="0" cy="0" r="34" fill="#091E3A" stroke="#00A3FF" stroke-width="2" filter="url(#glow2)" />
    <path d="M -16 -6 L -6 -6 L -6 -14 L 0 -14 L 0 -6 L 16 -6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 16 6 L 6 6 L 6 14 L 0 14 L 0 6 L -16 6" stroke="#00A3FF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Router: R3-DR / Distribution</text>
    <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">Router-ID: 3.3.3.3 (DR)</text>
  </g>
</svg>
