<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1C33" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" rx="8" />

  <!-- Banner -->
  <rect x="20" y="20" width="760" height="40" rx="6" fill="#0A182E" stroke="#008CFF" stroke-width="1" stroke-opacity="0.3" />
  <text x="40" y="45" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#00A3FF">TOPOLOGY: TRAFFIC FILTERING WITH EXTENDED ACL 101</text>
  <text x="730" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#EF4444" text-anchor="end">&#128737; Security Inspection Point</text>

  <!-- Left: Department Networks -->
  <!-- Sales VLAN 10 (Allowed Web) -->
  <rect x="40" y="90" width="220" height="140" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5" />
  <text x="55" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34D399">Staff LAN (192.168.10.0/24)</text>
  <text x="55" y="135" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Permit HTTP (TCP 80)</text>
  <text x="55" y="150" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Permit HTTPS (TCP 443)</text>
  <text x="55" y="165" font-family="'Inter', sans-serif" font-size="10" fill="#34D399">&#10004; Status: Full Access</text>

  <!-- Guest VLAN 30 (Blocked from Finance) -->
  <rect x="40" y="260" width="220" height="150" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="#EF4444" stroke-width="1.5" />
  <text x="55" y="285" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F87171">Guest LAN (192.168.30.0/24)</text>
  <text x="55" y="305" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Deny IP to Finance Server</text>
  <text x="55" y="320" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Permit DNS (UDP 53)</text>
  <text x="55" y="335" font-family="'Inter', sans-serif" font-size="10" fill="#F87171">&#10008; Status: Filtered by ACL</text>

  <!-- Central Security Gateway Router -->
  <g transform="translate(390, 240)">
    <circle cx="0" cy="0" r="38" fill="#1C1427" stroke="#EF4444" stroke-width="2.5" filter="url(#glow4)" />
    <!-- Shield Icon -->
    <path d="M 0 -18 L 14 -12 L 14 4 C 14 14 0 20 0 20 C 0 20 -14 14 -14 4 L -14 -12 Z" fill="none" stroke="#EF4444" stroke-width="2" />
    <path d="M -6 0 L -2 4 L 6 -4" stroke="#10B981" stroke-width="2" fill="none" />
    <text x="0" y="-48" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Border Router (Edge-01)</text>
    <rect x="-95" y="46" width="190" height="34" rx="4" fill="#0B172B" stroke="#008CFF" stroke-width="1" />
    <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F87171" text-anchor="middle">access-group 101 in</text>
    <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Applied on Interface G0/0</text>
  </g>

  <!-- Connection Links with Status Indicators -->
  <path d="M 260 160 L 352 230" stroke="#10B981" stroke-width="2.5" />
  <circle cx="310" cy="190" r="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="310" y="193" font-family="'Inter', sans-serif" font-size="9" fill="#34D399" text-anchor="middle">&#10003;</text>

  <path d="M 260 330 L 352 250" stroke="#EF4444" stroke-width="2.5" />
  <circle cx="310" cy="295" r="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5" />
  <text x="310" y="298" font-family="'Inter', sans-serif" font-size="9" fill="#F87171" text-anchor="middle">&#10005;</text>

  <!-- Right: Protected Finance Server Farm -->
  <rect x="520" y="140" width="240" height="200" rx="10" fill="rgba(0, 140, 255, 0.05)" stroke="#008CFF" stroke-width="1.5" />
  <rect x="535" y="150" width="180" height="22" rx="4" fill="#008CFF" />
  <text x="625" y="165" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SECURE SERVER SEGMENT</text>
  
  <g transform="translate(640, 250)">
    <rect x="-50" y="-35" width="100" height="70" rx="4" fill="#0A1D36" stroke="#008CFF" stroke-width="1.5" />
    <rect x="-40" y="-25" width="80" height="8" rx="2" fill="#008CFF" />
    <circle cx="30" cy="-21" r="2" fill="#34D399" />
    <rect x="-40" y="-10" width="80" height="8" rx="2" fill="#008CFF" />
    <circle cx="30" cy="-6" r="2" fill="#34D399" />
    <rect x="-40" y="5" width="80" height="8" rx="2" fill="#008CFF" />
    <circle cx="30" cy="9" r="2" fill="#34D399" />
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Finance &amp; DB Server</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">10.10.10.50/24</text>
  </g>

  <line x1="428" y1="240" x2="520" y2="240" stroke="#008CFF" stroke-width="2.5" />
  <text x="475" y="230" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">G0/1</text>
</svg>
