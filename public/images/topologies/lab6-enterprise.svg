<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1C33" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)" rx="8" />

  <!-- Banner -->
  <rect x="20" y="20" width="760" height="40" rx="6" fill="#0A182E" stroke="#008CFF" stroke-width="1" stroke-opacity="0.3" />
  <text x="40" y="45" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#00A3FF">TOPOLOGY: CAMPUS ENTERPRISE MULTI-TIER NETWORK</text>
  <text x="730" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">Core / Distribution / Access Layers</text>

  <!-- Core Layer Router -->
  <g transform="translate(400, 105)">
    <circle cx="0" cy="0" r="28" fill="#091E3A" stroke="#00A3FF" stroke-width="2" filter="url(#glow6)" />
    <path d="M -12 -5 L -4 -5 L -4 -10 L 0 -10 L 0 -5 L 12 -5" stroke="#00A3FF" stroke-width="1.5" fill="none" />
    <path d="M 12 5 L 4 5 L 4 10 L 0 10 L 0 5 L -12 5" stroke="#00A3FF" stroke-width="1.5" fill="none" />
    <text x="0" y="-34" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enterprise Core (Cisco 2911)</text>
    <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8" text-anchor="middle">OSPF Area 0 + BGP Gateway</text>
  </g>

  <!-- Redundant links from Core to Distribution -->
  <line x1="380" y1="125" x2="260" y2="195" stroke="#008CFF" stroke-width="2" />
  <line x1="420" y1="125" x2="540" y2="195" stroke="#008CFF" stroke-width="2" />
  <line x1="280" y1="210" x2="520" y2="210" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Distribution Layer Switches -->
  <g transform="translate(240, 210)">
    <rect x="-45" y="-15" width="90" height="30" rx="4" fill="#0A2244" stroke="#008CFF" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">DIST-SW1 (L3)</text>
    <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">HSRP Active GW</text>
  </g>

  <g transform="translate(560, 210)">
    <rect x="-45" y="-15" width="90" height="30" rx="4" fill="#0A2244" stroke="#008CFF" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">DIST-SW2 (L3)</text>
    <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">HSRP Standby GW</text>
  </g>

  <!-- Access Layer links -->
  <line x1="240" y1="225" x2="160" y2="300" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="240" y1="225" x2="330" y2="300" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="560" y1="225" x2="480" y2="300" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="560" y1="225" x2="650" y2="300" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Access Layer Switches -->
  <g transform="translate(160, 310)">
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#081A33" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">ACC-SW1</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">VLAN 10</text>
  </g>

  <g transform="translate(330, 310)">
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#081A33" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">ACC-SW2</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">VLAN 20</text>
  </g>

  <g transform="translate(480, 310)">
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#081A33" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">ACC-SW3</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">Server Farm</text>
  </g>

  <g transform="translate(650, 310)">
    <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#081A33" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">ACC-SW4</text>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">DMZ Zone</text>
  </g>

  <!-- Bottom Labels -->
  <rect x="50" y="380" width="700" height="45" rx="6" fill="#0B1C33" stroke="#008CFF" stroke-width="1" />
  <text x="70" y="407" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">
    <tspan fill="#00A3FF" font-weight="700">Enterprise Stack: </tspan>
    OSPF Dynamic Routing &#8226; 802.1Q Inter-VLAN &#8226; HSRP Gateway Redundancy &#8226; Port Security &#8226; DHCP/NAT Overload
  </text>
</svg>
